function allTasks(){return [...PHASES.flatMap(p=>p.tasks.map(t=>({...t,phase:p.id,phaseTitle:p.title}))),...state.customTasks.filter(t=>t&&t.id&&t.title).map(t=>({...t,phase:t.phase||'P01',phaseTitle:PHASES.find(p=>p.id===(t.phase||'P01'))?.title||'Дополнительно'}))]}
function status(id){return ['todo','doing','done'].includes(state.statuses?.[id])?state.statuses[id]:'todo'}
function count(p){const ts=allTasks().filter(t=>t.phase===p.id);return{total:ts.length,done:ts.filter(t=>status(t.id)==='done').length,doing:ts.filter(t=>status(t.id)==='doing').length}}

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateInput(date){return date.length>10?'+'+date.padStart(12,'0'):date}
function dayAdd(d,n){const v=new Date(dateInput(d)+'T12:00:00');v.setDate(v.getDate()+n);return v}
function iso(date){return [String(date.getFullYear()).padStart(4,'0'),String(date.getMonth()+1).padStart(2,'0'),String(date.getDate()).padStart(2,'0')].join('-')}
function fmt(d){return new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'short',year:'numeric'}).format(d)}
function nextPhase(){return PHASES.find(p=>count(p).done<count(p).total)||PHASES.at(-1)}
function totalDone(){return allTasks().filter(t=>status(t.id)==='done').length}
function validStudyDate(value){
  return typeof value==='string' && /^\d{4}-\d{2}-\d{2}$/.test(value) && iso(dayAdd(value,0))===value;
}
function validStudyMinutes(value){
  return Number.isInteger(value) && value>=1 && value<=720;
}
function cleanStudyDays(value){
  if(!value || typeof value!=='object')return {};
  return Object.fromEntries(Object.entries(value).filter(([date,ms])=>
    validStudyDate(date) && Number.isSafeInteger(ms) && ms>0
  ));
}
function cleanStudyTimer(timer){
  if(!timer || !Number.isSafeInteger(timer.remainingMs) ||
    timer.remainingMs<1 || timer.remainingMs>720*MINUTE_MS)return null;
  if(timer.startedAt!==null &&
    (!Number.isSafeInteger(timer.startedAt) || !Number.isFinite(+new Date(timer.startedAt+timer.remainingMs))))return null;
  return {remainingMs:timer.remainingMs,startedAt:timer.startedAt,days:cleanStudyDays(timer.days)};
}
function dailyStudy(){
  const days={...state.studyDays};
  for(const {date,hours} of state.journal){
    const ms=Number(hours)*HOUR_MS;
    if(validStudyDate(date) && Number.isFinite(ms) && ms>0)days[date]=(days[date]||0)+ms;
  }
  return days;
}
function daysBetween(start,end){
  return (Date.parse(dateInput(end))-Date.parse(dateInput(start)))/DAY_MS;
}
function schedule(today=iso(new Date())){
  const days=dailyStudy();
  const loggedDates=Object.keys(days).filter(date=>date<=today).sort();
  const start=state.startDate>today?state.startDate:today;
  const plannedPace=state.studyMinutes*MINUTE_MS;
  let pace=plannedPace;
  if(loggedDates.length){
    // Omit the unfinished day until it has a logged session or manual entry.
    const lastSample=days[today]?today:iso(dayAdd(today,-1));
    const observedDays=Math.min(28,daysBetween(loggedDates[0],lastSample)+1);
    const windowStart=iso(dayAdd(lastSample,1-observedDays));
    const observed=loggedDates.reduce((total,date)=>date>=windowStart?total+days[date]:total,0);
    const plannedDays=Math.max(0,7-observedDays);
    // Keep projecting at least one planned session per week after a long break.
    pace=Math.max(plannedPace/7,(observed+plannedDays*plannedPace)/(observedDays+plannedDays));
  }

  const phases={};
  let elapsedDays=0;
  let end=null;
  for(const phase of PHASES){
    const {done,total}=count(phase);
    if(done===total)continue;
    const phaseStart=iso(dayAdd(start,Math.floor(elapsedDays)));
    const plannedDays=(phase.endWeek-phase.startWeek+1)*7;
    const remainingWork=plannedDays*HOUR_MS*(total-done)/total;
    elapsedDays+=remainingWork/pace;
    end=iso(dayAdd(start,Math.ceil(elapsedDays)-1));
    phases[phase.id]={start:phaseStart,end};
  }
  return {start,end,phases,pace};
}
function formatDate(date){return fmt(dayAdd(date,0))}
function phaseDates(period){
  if(!period)return 'Завершён';
  const start=formatDate(period.start);
  return period.start===period.end?start:`${start} — ${formatDate(period.end)}`;
}
function formatStudyTime(ms){
  const seconds=Math.floor(ms/1000);
  const hours=Math.floor(seconds/3600);
  const minutes=Math.floor(seconds/60)%60;
  if(hours)return `${hours} ч ${minutes} мин`;
  if(minutes)return `${minutes} мин${seconds%60?` ${seconds%60} сек`:''}`;
  return seconds?`${seconds} сек`:'0 мин';
}
let studyMessage='';
function startStudyTimer(minutes,now=Date.now()){
  if(state.studyTimer || !validStudyMinutes(minutes))return;
  state.studyMinutes=minutes;
  state.studyTimer={remainingMs:minutes*MINUTE_MS,startedAt:now,days:{}};
  studyMessage='';
  save();
}
function resumeStudyTimer(now=Date.now()){
  if(state.studyTimer?.startedAt!==null)return;
  state.studyTimer.startedAt=now;
  save();
}
function timerRemaining(timer,now){
  return timer.startedAt===null?timer.remainingMs:
    Math.max(0,timer.remainingMs-Math.max(0,now-timer.startedAt));
}
function settleStudyTimer(now=Date.now(),action){
  const timer=state.studyTimer;
  if(!timer)return false;
  const remaining=timerRemaining(timer,now);
  if(remaining && !action)return false;

  if(timer.startedAt!==null){
    const end=timer.startedAt+timer.remainingMs-remaining;
    let cursor=timer.startedAt;
    while(cursor<end){
      const day=new Date(cursor);
      const key=iso(day);
      day.setHours(24,0,0,0);
      const midnight=+day;
      const next=Math.min(end,midnight);
      timer.days[key]=(timer.days[key]||0)+next-cursor;
      cursor=next;
    }
  }

  if(action==='pause' && remaining){
    timer.remainingMs=remaining;
    timer.startedAt=null;
    save();
    return false;
  }
  for(const [date,ms] of Object.entries(timer.days)){
    state.studyDays[date]=(state.studyDays[date]||0)+ms;
  }
  const elapsed=Object.values(timer.days).reduce((total,ms)=>total+ms,0);
  state.studyTimer=null;
  studyMessage=elapsed?`Сессия сохранена · ${formatStudyTime(elapsed)}`:'Сессия завершена';
  save();
  return true;
}

function updateStudyClock(now=Date.now()){
  const clock=document.getElementById('studyClock');

  const timer=state.studyTimer;

function updateStudyView(updateForecast){

function tickStudyTimer(){
  const now=Date.now();
  if(state.studyTimer && timerRemaining(state.studyTimer,now)===0){
    state=load(state);
    const finished=settleStudyTimer(now);
    updateStudyView(finished || !state.studyTimer);
  }
  updateStudyClock(now);
}

<div id="studyTimer"></div><div class="two-cols"><div><div class="card"><h2>Новая запись</h2><form id="journalForm"><div class="field"><label for="studyDate">Дата</label><input type="date" name="date" id="studyDate" required value="${iso(new Date())}"></div><div class="field"><label for="hours">Дополнительное время вне таймера, ч</label><input type="number" name="hours" id="hours" min="0" max="120" step="any" value="0"></div><div class="field"><label for="worked">Что сделал и чему научился?</label><textarea id="worked" name="worked" maxlength="4000" required placeholder="Например: реализовал переход между фазами, разобрался с discriminated unions..."></textarea></div><div class="field"><label for="blocker">Что осталось неясным? Следующий шаг</label><textarea id="blocker" name="blocker" maxlength="4000" placeholder="Ошибка, вопрос, тема для повторения..."></textarea></div><div class="field"><label for="proof">Коммит / PR / ссылка (необязательно)</label><input id="proof" name="proof" maxlength="500" placeholder="https://github.com/..."></div><button class="btn primary" type="submit">Сохранить запись</button></form></div></div><div><div id="studyDaily"></div><div class="card" style="margin-top:18px"><h2>Заметки</h2>${state.journal.length?state.journal.slice().reverse().map(j=>`<div class="journal-entry"><div class="date">${esc(j.date)} · ${Number(j.hours||0)} ч</div><p><strong>Изучено:</strong> ${esc(j.worked)}</p>${j.blocker?`<p><strong>Далее:</strong> ${esc(j.blocker)}</p>`:''}${/^https?:\/\//.test(j.proof||'')?`<a target="_blank" rel="noopener noreferrer" href="${esc(j.proof)}">Результат ↗</a>`:''}<div style="margin-top:10px"><button class="btn ghost danger" data-del-journal="${esc(j.id)}">Удалить запись</button></div></div>`).join(''):'<div class="empty">Пока нет записей. Начни с первого учебного дня.</div>'}</div></div></div>`}
function settings(){return `${shell('Настройки и сохранение','Эта версия — автономная HTML-страница. Никакой регистрации или сервера не требуется.')}
<div class="two-cols"><div class="card"><h2>Календарь</h2><div class="field"><label for="startDate">Дата старта плана</label><input type="date" id="startDate" value="${esc(state.startDate)}"></div><p class="row-note">Прогноз начинается с сегодняшнего дня или выбранной даты старта, если она позже. Объём базового плана рассчитан из часа в день на 52 недели и уменьшается по мере выполнения задач. Темп учитывает занятия за последние 28 дней. Пока данных мало, расчёт опирается на одну сессию в день, после долгого перерыва — минимум на одну сессию в неделю.</p><button class="btn primary" id="saveSettings">Сохранить дату</button><div class="section-divider"></div><h2>Резервная копия</h2><p class="row-note">Экспорт создаёт JSON со статусами, оценками навыков, журналом, временем по дням, состоянием таймера, датой старта и собственными задачами. Импорт заменяет текущий прогресс; перед импортом сделай резервную копию.</p><button class="btn" data-export="1">↓ Скачать JSON</button> <button class="btn" data-import="1">↑ Импорт JSON</button><div class="section-divider"></div><button class="btn danger" id="resetBtn">Очистить прогресс</button></div><div class="card"><h2>Что сохраняется</h2><p class="row-note">В пределах текущего браузера и адреса страницы: статус задач, журнал, время сессий, уровни знаний и дата плана. На другом браузере или другом устройстве данные не появятся автоматически.</p><div class="notice"><strong>Для работы с нескольких устройств:</strong> размести файл на GitHub Pages, регулярно экспортируй JSON и импортируй на нужном устройстве. Для настоящей автоматической синхронизации потребуется backend или интеграция с GitHub.</div><p class="row-note">Не вводи сюда токены, секреты и API-ключи. Этот трекер не связывается с OpenAI, DeepTutor или GitHub.</p></div></div>`}
function render(){document.getElementById('nav').innerHTML=NAV.map(([id,ico,label])=>`<button data-nav="${id}" class="${tab===id?'active':''}"><span class="nav-ico">${ico}</span>${label}</button>`).join('');document.getElementById('breadcrumb').textContent='/ '+NAV.find(x=>x[0]===tab)?.[2];document.getElementById('view').innerHTML=({overview,timeline,tasks,learning,journal,settings}[tab]||overview)();updateStudyView(false);}
function download(str,name,mime){const blob=new Blob([str],{type:mime});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function exportData(){download(JSON.stringify({format:'strategy-lab-v1',exportedAt:new Date().toISOString(),state},null,2),`strategy-lab-backup-${iso(new Date())}.json`,'application/json')}
function safeURL(u){return /^https?:\/\//.test(u||'')}
function importData(raw){const v=JSON.parse(raw);if(v.format!=='strategy-lab-v1'||!v.state||typeof v.state!=='object')throw Error('Неверный формат JSON');const s=v.state;if(!s.statuses||typeof s.statuses!=='object'||!Array.isArray(s.journal)||!s.levels||typeof s.levels!=='object')throw Error('Не хватает полей прогресса');if(!validStudyDate(s.startDate))throw Error('Неверная дата старта');if(!confirm('Импорт заменит текущий прогресс, журнал и время учёбы. Продолжить?'))return;state={...structuredClone(SEED),startDate:s.startDate,
  studyMinutes:validStudyMinutes(s.studyMinutes)?s.studyMinutes:SEED.studyMinutes,
  studyDays:cleanStudyDays(s.studyDays),studyTimer:cleanStudyTimer(s.studyTimer),
  statuses:Object.fromEntries(Object.entries(s.statuses).filter(([k,v])=>/^[A-Za-z0-9-]{1,70}$/.test(k)&&['todo','doing','done'].includes(v))),levels:Object.fromEntries(Object.entries(s.levels).filter(([k,v])=>typeof k==='string'&&[0,1,2,3].includes(Number(v))).map(([k,v])=>[k,Number(v)])),journal:s.journal.slice(0,500).map(j=>({id:String(j.id||''),date:String(j.date||''),hours:Number(j.hours)||0,worked:String(j.worked||'').slice(0,4000),blocker:String(j.blocker||'').slice(0,4000),proof:safeURL(j.proof)?String(j.proof).slice(0,500):''})),customTasks:Array.isArray(s.customTasks)?s.customTasks.slice(0,300).filter(t=>t&&typeof t.id==='string'&&/^CUSTOM-[a-zA-Z0-9-]{1,70}$/.test(t.id)).map(t=>({id:t.id,title:String(t.title||'').slice(0,300),detail:String(t.detail||'').slice(0,800),kind:'Дополнительно',phase:PHASES.some(p=>p.id===t.phase)?t.phase:'P01'})):[]};studyMessage='';settleStudyTimer();save();render();alert('Прогресс импортирован')}
document.addEventListener('change',e=>{const c=e.target;if(c.matches('[data-check]'))setStatus(c.dataset.check,c.checked?'done':'todo');else if(c.matches('[data-status]'))setStatus(c.dataset.status,c.value);else if(c.matches('[data-level]')){state.levels[c.dataset.level]=Number(c.dataset.number);save();render()}else if(c.id==='phaseFilter'){chosenPhase=c.value;render()}else if(c.id==='importFile'){const f=c.files?.[0];if(!f)return;f.text().then(importData).catch(e=>alert('Ошибка импорта: '+e.message));c.value=''}});
document.addEventListener('input',e=>{if(e.target.id==='taskSearch'){search=e.target.value;const a=allTasks().filter(t=>(chosenPhase==='all'||t.phase===chosenPhase)&&(filter==='all'||status(t.id)===filter)&&(!search||(`${t.title} ${t.detail} ${t.phaseTitle}`).toLowerCase().includes(search.toLowerCase())));document.getElementById('taskResults').innerHTML=a.length?a.map(taskHTML).join(''):'<div class="empty">Нет задач по текущему фильтру.</div>'}});
document.addEventListener('click',e=>{const el=e.target.closest('[data-nav],[data-filter],[data-jump-phase],[data-level],[data-export],[data-import],[data-del-journal],#addTaskBtn,#resetBtn,#saveSettings,#exportBtn,#importBtn');if(!el)return;if(el.dataset.nav){navigate(el.dataset.nav);return}if(el.dataset.filter){filter=el.dataset.filter;render();return}if(el.dataset.jumpPhase){activePhase=el.dataset.jumpPhase;tab='timeline';render();document.getElementById(activePhase)?.scrollIntoView({behavior:'smooth',block:'center'});return}if(el.dataset.level){state.levels[el.dataset.level]=Number(el.dataset.number);save();render();return}if(el.hasAttribute('data-export')||el.id==='exportBtn'){exportData();return}if(el.hasAttribute('data-import')||el.id==='importBtn'){document.getElementById('importFile').click();return}if(el.dataset.delJournal){if(confirm('Удалить запись журнала?')){state.journal=state.journal.filter(j=>j.id!==el.dataset.delJournal);save();render()}return}if(el.id==='saveSettings'){const v=document.getElementById('startDate').value;if(validStudyDate(v)){state.startDate=v;save();render();alert('Календарь обновлён')}return}if(el.id==='resetBtn'){if(confirm('Удалить весь прогресс, журнал, оценки навыков и время учёбы на этом устройстве?')){state=structuredClone(SEED);studyMessage='';save();render()}return}if(el.id==='addTaskBtn'){const title=prompt('Название новой задачи:');if(!title?.trim())return;const p=prompt('В какой этап добавить? (например, P01)',nextPhase().id);const pid=PHASES.some(x=>x.id===p)?p:nextPhase().id;const detail=prompt('Критерий готовности / описание (необязательно):')||'';state.customTasks.push({id:'CUSTOM-'+Date.now(),title:title.slice(0,300).trim(),detail:detail.slice(0,800),phase:pid,kind:'Дополнительно'});save();render();return}});
document.addEventListener('submit',e=>{if(e.target.id!=='journalForm')return;e.preventDefault();const d=new FormData(e.target);const w=String(d.get('worked')||'').trim();if(!w)return;state.journal.push({id:'j'+Date.now(),date:String(d.get('date')),hours:Math.min(120,Math.max(0,Number(d.get('hours'))||0)),worked:w,blocker:String(d.get('blocker')||''),proof:String(d.get('proof')||'').trim()});save();render()});
document.addEventListener('submit',e=>{
  if(e.target.id!=='studyForm')return;
  e.preventDefault();
  const timer=state.studyTimer;
  if(!timer){
    startStudyTimer(Number(new FormData(e.target).get('minutes')));
    updateStudyView(true);
    return;
  }
  if(timer.startedAt===null){
    resumeStudyTimer();
    updateStudyView(false);
    return;
  }
  updateStudyView(settleStudyTimer(Date.now(),'pause'));
});
document.addEventListener('click',e=>{
  if(!e.target.closest('#studyFinish'))return;
  updateStudyView(settleStudyTimer(Date.now(),'finish'));
});
window.addEventListener('storage',e=>{
  if(e.key!==KEY && e.key!==null)return;
  state=load();
  studyMessage='';
  updateStudyView(true);
});
settleStudyTimer();
render();
setInterval(tickStudyTimer,250);
</script></body></html>
